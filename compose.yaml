name: welyt

services:
  api:
    image: ghcr.io/tapanmeena/welyt-api:latest
    pull_policy: always
    ports:
      - '127.0.0.1:3000:3000'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: /data/welyt.db
      TRUST_PROXY: 172.30.250.1
      AUTHKIT_ISSUER_URL: ${AUTHKIT_ISSUER_URL:-https://auth.tapanmeena.com}
      AUTHKIT_POOL_SLUG: ${AUTHKIT_POOL_SLUG:-one-auth}
      APP_SCHEME: ${APP_SCHEME:-welyt}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FX_AUTO_REFRESH: ${FX_AUTO_REFRESH:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    volumes:
      - api-data:/data
    networks:
      - backend
    logging:
      driver: local

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.250.0/29
          gateway: 172.30.250.1

volumes:
  api-data:
