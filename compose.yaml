name: welyt

services:
  api:
    image: ghcr.io/tapanmeena/welyt-api:latest
    pull_policy: always
    ports:
      - '127.0.0.1:3000:3000'
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
      DATABASE_URL: /data/welyt.db
      TRUST_PROXY: 172.30.250.1
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-15}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      APP_SCHEME: ${APP_SCHEME:-welyt}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FX_AUTO_REFRESH: ${FX_AUTO_REFRESH:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      MAILER_PROVIDER: smtp
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      # Unset selects implicit TLS for port 465, otherwise STARTTLS when supported.
      SMTP_SECURE:
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in .env}
      SMTP_PASS: ${SMTP_PASS:?Set SMTP_PASS in .env}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - api-data:/data
    networks:
      - backend
    logging:
      driver: local

networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.250.0/29
          gateway: 172.30.250.1

volumes:
  api-data:
